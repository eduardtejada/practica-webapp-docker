services:
  app:
    build: .
    container_name: practica7_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: practica_user
      DB_PASSWORD: practica_password
      DB_NAME: practica_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: practica7_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: practica_db
      MYSQL_USER: practica_user
      MYSQL_PASSWORD: practica_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
